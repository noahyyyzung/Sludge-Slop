<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';

/* =========================================================
   CONSTANTS
   ========================================================= */
const S = 0.25;           // grid cell (metres)
const P = S / 4;          // height unit: a full block is 4 units tall
const GAP = 0.003, BEVEL = 0.012;
const UP = new THREE.Vector3(0, 1, 0);
const PAD_TOP = 0.45;
const PAD_POS = new THREE.Vector3(0, PAD_TOP, -1.7);

const PALETTE = [0xf4f4f4,0xa7adb5,0x5b6169,0x23262b,0xd32f2f,0xf57c00,0xfbc02d,0x9ccc3c,
                 0x2e7d32,0x00897b,0x4fc3f7,0x1e5bd6,0x1a237e,0x7b3fb5,0xec5f9a,0xd8b98a];
const PALETTE_NAMES = ['White','Light Grey','Dark Grey','Black','Red','Orange','Yellow','Lime',
                       'Green','Teal','Sky Blue','Blue','Navy','Purple','Pink','Tan'];
let currentColor = 0xd32f2f;
let tool = 'build';   // build | paint | wire

/* =========================================================
   PART DEFINITIONS   (w = cells along x, d = cells along z, h = quarter-block units)
   ========================================================= */
const DEFS = {};
const CATS = { Blocks: [], Slabs: [], Wedges: [], Shapes: [] };
function def(id, name, cat, w, d, h, kind, glass = false) {
  DEFS[id] = { id, name, cat, w, d, h, kind, glass };
  CATS[cat].push(id);
}
def('bk11', 'Block 1x1',   'Blocks', 1, 1, 4, 'box');
def('bk21', 'Block 2x1',   'Blocks', 2, 1, 4, 'box');
def('bk31', 'Block 3x1',   'Blocks', 3, 1, 4, 'box');
def('bk41', 'Block 4x1',   'Blocks', 4, 1, 4, 'box');
def('bk22', 'Block 2x2',   'Blocks', 2, 2, 4, 'box');
def('bk33', 'Block 3x3',   'Blocks', 3, 3, 4, 'box');
def('bm61', 'Beam 6x1',    'Blocks', 6, 1, 4, 'box');
def('pl12', 'Pillar',      'Blocks', 1, 1, 8, 'box');
def('bb22', 'Big Block',   'Blocks', 2, 2, 8, 'box');
def('hf11', 'Half 1x1',    'Slabs', 1, 1, 2, 'box');
def('hf21', 'Half 2x1',    'Slabs', 2, 1, 2, 'box');
def('hf22', 'Half 2x2',    'Slabs', 2, 2, 2, 'box');
def('pt11', 'Plate 1x1',   'Slabs', 1, 1, 1, 'box');
def('pt21', 'Plate 2x1',   'Slabs', 2, 1, 1, 'box');
def('pt22', 'Plate 2x2',   'Slabs', 2, 2, 1, 'box');
def('pt42', 'Plate 4x2',   'Slabs', 4, 2, 1, 'box');
def('pt44', 'Plate 4x4',   'Slabs', 4, 4, 1, 'box');
def('ch86', 'Chassis 8x6', 'Slabs', 8, 6, 1, 'box');
def('wd11', 'Wedge',       'Wedges', 1, 1, 4, 'wedge');
def('wd12', 'Long Wedge',  'Wedges', 1, 2, 4, 'wedge');
def('wd21', 'Wide Wedge',  'Wedges', 2, 1, 4, 'wedge');
def('hw11', 'Half Wedge',  'Wedges', 1, 1, 2, 'wedge');
def('fw12', 'Flat Wedge',  'Wedges', 1, 2, 2, 'wedge');
def('cn11', 'Corner',      'Wedges', 1, 1, 4, 'corner');
def('cc11', 'Cut Corner',  'Wedges', 1, 1, 4, 'cut');
def('uw11', 'Under Wedge', 'Wedges', 1, 1, 4, 'inv');
def('re11', 'Round Edge',  'Wedges', 1, 1, 4, 'redge');
def('cy11', 'Cylinder',    'Shapes', 1, 1, 4, 'cyl');
def('cy22', 'Big Cylinder','Shapes', 2, 2, 4, 'cyl');
def('co11', 'Cone',        'Shapes', 1, 1, 4, 'cone');
def('nc22', 'Nose Cone',   'Shapes', 2, 2, 8, 'nose');
def('dm22', 'Dome',        'Shapes', 2, 2, 4, 'dome');
def('gb11', 'Glass Block', 'Shapes', 1, 1, 4, 'box', true);
def('gp21', 'Glass Panel', 'Shapes', 2, 1, 4, 'pane', true);
def('ws22', 'Windshield',  'Shapes', 2, 2, 4, 'wind', true);
def('tf12', 'Tail Fin',    'Shapes', 1, 2, 6, 'fin');

/* ---------- functional parts (steps 2-6) ---------- */
Object.assign(CATS, { Drive: [], Flight: [], Gadgets: [], Mech: [] });
function fdef(id, name, cat, w, d, h, kind, extra = {}) { def(id, name, cat, w, d, h, kind); Object.assign(DEFS[id], { fn: true, wire: true }, extra); }
fdef('seat', 'Seat',          'Drive', 2, 2, 6, 'seat',   { wire: false });
fdef('fpan', 'Flight Panel',  'Drive', 2, 1, 3, 'fpanel', { wire: false, panel: 'STICK' });
fdef('dpan', 'Drive Panel',   'Drive', 2, 1, 3, 'dpanel', { wire: false, panel: 'WHEEL' });
fdef('engn', 'Engine',        'Drive', 2, 2, 4, 'engine', { wire: false, density: 900 });
fdef('whl',  'Wheel',         'Drive', 1, 3, 12, 'wheel');
fdef('bwhl', 'Big Wheel',     'Drive', 1, 4, 16, 'wheel');
fdef('swhl', 'Small Wheel',   'Drive', 1, 2, 8, 'wheel');
fdef('thr',  'Thruster',      'Drive', 1, 2, 4, 'thruster', { force: 700 });
fdef('lthr', 'Lift Thruster', 'Drive', 2, 2, 2, 'lift',     { force: 1000 });
fdef('jet',  'Jet Engine',    'Flight', 2, 3, 4, 'jet',     { force: 2600 });
fdef('wng',  'Wing',          'Flight', 4, 2, 1, 'wing');
fdef('bwng', 'Big Wing',      'Flight', 6, 3, 1, 'wing');
fdef('swng', 'Small Wing',    'Flight', 2, 2, 1, 'wing');
fdef('rudr', 'Rudder',        'Flight', 1, 2, 6, 'rudder');
fdef('prop', 'Propeller',     'Flight', 3, 1, 12, 'prop',   { force: 900 });
fdef('rotr', 'Heli Rotor',    'Flight', 2, 2, 3, 'rotor',   { force: 1400 });
fdef('abrk', 'Air Brake',     'Flight', 2, 1, 1, 'airbrake');
fdef('chut', 'Parachute',     'Flight', 2, 2, 3, 'chute');
fdef('lite', 'Headlight',     'Gadgets', 1, 1, 2, 'light');
fdef('bcn',  'Beacon',        'Gadgets', 1, 1, 2, 'beacon');
fdef('horn', 'Horn',          'Gadgets', 1, 1, 2, 'horn');
fdef('bst',  'Boost',         'Gadgets', 1, 2, 3, 'boost');
fdef('smk',  'Smoke Trail',   'Gadgets', 1, 1, 3, 'smoke');
fdef('lzr',  'Laser',         'Gadgets', 1, 3, 2, 'laser');
fdef('cam',  'Chase Camera',  'Gadgets', 1, 1, 2, 'camera');
fdef('gyro', 'Gyro',          'Gadgets', 2, 2, 3, 'gyro');
fdef('blst', 'Ballast',       'Gadgets', 1, 1, 4, 'ballast', { wire: false, density: 6000 });
fdef('door', 'Door',          'Mech', 2, 1, 8, 'door');
fdef('flap', 'Ramp Flap',     'Mech', 2, 2, 1, 'flap');
fdef('pstn', 'Piston',        'Mech', 1, 1, 4, 'piston');
fdef('gear', 'Landing Gear',  'Mech', 1, 1, 8, 'gear');
fdef('spin', 'Spinner',       'Mech', 2, 2, 2, 'spinner');
fdef('psea', 'Passenger Seat','Mech', 2, 2, 6, 'seat',    { wire: false, passenger: true });
fdef('sprg', 'Spring Pad',    'Mech', 2, 2, 2, 'spring');
fdef('skid', 'Skid',          'Mech', 1, 4, 1, 'skid',    { wire: false });
fdef('anch', 'Anchor',        'Mech', 1, 1, 3, 'anchor');

const INPUT_COLORS = { X: 0x3b82f6, Y: 0xfacc15, A: 0x22c55e, B: 0xef4444, STICK: 0xffffff, WHEEL: 0xffffff };
const DARK  = new THREE.MeshPhongMaterial({ color: 0x2a2d33, shininess: 60, specular: 0x555555 });
const METAL = new THREE.MeshPhongMaterial({ color: 0x9aa1ab, shininess: 90, specular: 0x888888 });
const glowCache = {};
const glowMat = c => glowCache[c] || (glowCache[c] = new THREE.MeshBasicMaterial({ color: c }));
const FLAME = new THREE.MeshBasicMaterial({ color: 0x7fd4ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
const FLAME_HOT = new THREE.MeshBasicMaterial({ color: 0xffa040, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
const BEAM = new THREE.MeshBasicMaterial({ color: 0xfff3c0, transparent: true, opacity: 0.18, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

const NI = g => { const n = g.index ? g.toNonIndexed() : g; flatUV(n); return n; };
const cylG = (r1, r2, h, seg = 20) => NI(new THREE.CylinderGeometry(r1, r2, h, seg));
const boxG = (w, h, d) => NI(new THREE.BoxGeometry(w, h, d));
const sphG = (r, ws = 16, hs = 10, tl = Math.PI) => NI(new THREE.SphereGeometry(r, ws, hs, 0, Math.PI * 2, 0, tl));
const torG = (R, r, seg = 28) => NI(new THREE.TorusGeometry(R, r, 8, seg));
const coneG = (r, h, seg = 16) => NI(new THREE.ConeGeometry(r, h, seg, 1, true));
function at(g, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) { if (rx) g.rotateX(rx); if (ry) g.rotateY(ry); if (rz) g.rotateZ(rz); g.translate(x, y, z); return g; }
function pbox(w, h, d, x = 0, y = 0, z = 0, bev = 0.01) {
  const X = w / 2, Z = d / 2;
  const g = chamferHull([V(-X,0,-Z),V(X,0,-Z),V(-X,0,Z),V(X,0,Z),V(-X,h,-Z),V(X,h,-Z),V(-X,h,Z),V(X,h,Z)], Math.min(bev, h / 3, w / 3, d / 3));
  panelUV(g, w, h, d); g.translate(x, y, z); return g;
}
const mergeL = list => mergeGeometries(list);

function fnBuild(D) {
  const W = D.w * S - GAP, L = D.d * S - GAP, H = D.h * P - GAP, hw = W / 2, hl = L / 2;
  const sub = (g, m, p = [0, 0, 0], extra = {}) => ({ g, m, p, ...extra });
  let main, subs = [], pads = null;
  const panelPads = top => ({ STICK: [-0.12, top + 0.1, 0], X: [0.06, top + 0.02, -0.05], Y: [0.16, top + 0.02, -0.05], A: [0.06, top + 0.02, 0.05], B: [0.16, top + 0.02, 0.05] });
  const panelButtons = top => ['X', 'Y', 'A', 'B'].map((k, i) => sub(cylG(0.028, 0.028, 0.025, 14), glowMat(INPUT_COLORS[k]), [i % 2 ? 0.16 : 0.06, top + 0.012, i < 2 ? -0.05 : 0.05]));
  switch (D.kind) {
    case 'seat':
      main = mergeL([pbox(W, 0.12, L), pbox(W, H - 0.12, 0.08, 0, 0.12, -hl + 0.04)]);
      subs = [sub(boxG(W - 0.08, 0.05, L - 0.16), DARK, [0, 0.145, 0.03]), sub(boxG(W - 0.1, H - 0.25, 0.04), DARK, [0, 0.12 + (H - 0.12) / 2, -hl + 0.1])];
      break;
    case 'fpanel': case 'dpanel': {
      main = pbox(W, H, L);
      pads = panelPads(H);
      subs = panelButtons(H);
      if (D.kind === 'fpanel') {
        subs.push(sub(cylG(0.05, 0.06, 0.03), DARK, [-0.12, H + 0.015, 0]));
        subs.push(sub(mergeL([at(cylG(0.012, 0.012, 0.13, 10), 0, 0.065, 0), at(sphG(0.028, 12, 8), 0, 0.14, 0)]), glowMat(0xd32f2f), [-0.12, H + 0.02, 0], { tag: 'stick' }));
      } else {
        subs.push(sub(cylG(0.012, 0.012, 0.1, 8), DARK, [-0.12, H + 0.05, 0]));
        const wg = mergeL([torG(0.085, 0.012), at(boxG(0.17, 0.014, 0.012)), at(boxG(0.014, 0.085, 0.012), 0, -0.04, 0)]);
        subs.push(sub(wg, DARK, [-0.12, H + 0.11, 0], { r: [-0.5, 0, 0], tag: 'wheel' }));
      }
      break;
    }
    case 'engine':
      main = pbox(W, H * 0.75, L);
      subs = [sub(mergeL([at(cylG(0.05, 0.05, 0.12), -0.1, 0, 0.08), at(cylG(0.05, 0.05, 0.12), 0.1, 0, 0.08), at(cylG(0.05, 0.05, 0.12), -0.1, 0, -0.08), at(cylG(0.05, 0.05, 0.12), 0.1, 0, -0.08)]), DARK, [0, H * 0.75 + 0.05, 0]),
              sub(mergeL([at(cylG(0.03, 0.03, 0.2), -0.12, 0, 0, Math.PI / 2), at(cylG(0.03, 0.03, 0.2), 0.12, 0, 0, Math.PI / 2)]), METAL, [0, H * 0.4, -hl - 0.05])];
      break;
    case 'wheel': {
      const R = Math.min(L, H) / 2;
      main = pbox(0.1, 0.1, 0.1, 0, H / 2 - 0.05, 0);
      subs = [sub(at(cylG(R, R, 0.2, 28), 0, 0, 0, 0, 0, Math.PI / 2), DARK, [0, H / 2, 0], { tag: 'wheel', order: 'YXZ' }),
              sub(mergeL([at(cylG(R * 0.62, R * 0.62, 0.21, 20), 0, 0, 0, 0, 0, Math.PI / 2), at(boxG(0.215, R * 1.1, 0.04)), at(boxG(0.215, 0.04, R * 1.1))]), METAL, [0, H / 2, 0], { tag: 'wheel', order: 'YXZ' })];
      break;
    }
    case 'thruster':
      main = at(cylG(0.1, 0.1, L * 0.75), 0, H / 2, 0.04, Math.PI / 2);
      subs = [sub(at(cylG(0.07, 0.11, 0.12), 0, 0, 0, Math.PI / 2), DARK, [0, H / 2, -hl + 0.06]),
              sub(at(coneG(0.08, 0.6), 0, -0.3, 0, Math.PI), FLAME, [0, H / 2, -hl], { r: [Math.PI / 2, 0, 0], tag: 'flame', hide: true })];
      break;
    case 'lift':
      main = mergeL([at(cylG(0.23, 0.23, H * 0.7, 28), 0, H * 0.35, 0)]);
      subs = [sub(at(cylG(0.18, 0.18, 0.02, 24), 0, 0, 0), DARK, [0, H * 0.7 + 0.01, 0]),
              sub(at(coneG(0.18, 0.7), 0, -0.35, 0, Math.PI), FLAME, [0, 0, 0], { tag: 'flame', hide: true })];
      break;
    case 'jet':
      main = at(cylG(0.2, 0.23, L * 0.85, 24), 0, H / 2, 0.03, Math.PI / 2);
      subs = [sub(at(torG(0.19, 0.03), 0, 0, 0), DARK, [0, H / 2, hl - 0.02]),
              sub(at(cylG(0.14, 0.2, 0.16, 20), 0, 0, 0, Math.PI / 2), DARK, [0, H / 2, -hl + 0.06]),
              sub(at(coneG(0.15, 1.2, 18), 0, -0.6, 0, Math.PI), FLAME_HOT, [0, H / 2, -hl], { r: [Math.PI / 2, 0, 0], tag: 'flame', hide: true })];
      break;
    case 'wing': {
      const t = H, pts = [];
      for (const x of [-hw, hw]) pts.push(V(x, t * 0.45, hl), V(x, t, hl * 0.4), V(x, 0, hl * 0.4), V(x, t * 0.5, -hl), V(x, t * 0.35, -hl), V(x, 0.0, hl * 0.9));
      main = chamferHull(pts, 0.004); panelUV(main, W, H, L);
      break;
    }
    case 'rudder': {
      const x = 0.022, top = -hl + 0.06, pts = [];
      for (const sx of [-x, x]) pts.push(V(sx, 0, -hl), V(sx, 0, hl), V(sx, H, -hl), V(sx, H, top), V(0, 0, hl + 0.01));
      main = chamferHull(pts, 0.006); panelUV(main, W, H, L);
      break;
    }
    case 'prop':
      main = pbox(0.12, 0.12, L, 0, H / 2 - 0.06, 0);
      subs = [sub(mergeL([at(boxG(W * 0.98, 0.07, 0.02), 0, 0, 0, 0, 0, 0.25), at(boxG(0.07, W * 0.98, 0.02), 0, 0, 0, 0, 0, 0.25), at(sphG(0.06, 12, 8), 0, 0, 0.02)]), DARK, [0, H / 2, hl], { tag: 'spinz' })];
      break;
    case 'rotor':
      main = mergeL([pbox(W * 0.7, 0.06, L * 0.7), at(cylG(0.04, 0.05, H - 0.06), 0, 0.06 + (H - 0.06) / 2, 0)]);
      subs = [sub(mergeL([boxG(2.2, 0.02, 0.12), boxG(0.12, 0.02, 2.2), at(cylG(0.07, 0.07, 0.05), 0, 0.02, 0)]), DARK, [0, H, 0], { tag: 'spiny' })];
      break;
    case 'airbrake':
      main = pbox(W, H * 0.5, L);
      subs = [sub(at(boxG(W - 0.02, 0.02, L - 0.02), 0, 0.01, -(L - 0.02) / 2), 'paint', [0, H * 0.5, hl - 0.01], { tag: 'flapx', paintKid: true })];
      break;
    case 'chute':
      main = pbox(W, H, L);
      subs = [sub(DARK && at(sphG(2.4, 20, 8, Math.PI / 2), 0, 0, 0), glowMat(0xf04a3a), [0, H + 3.2, 0], { tag: 'chute', hide: true }),
              sub(mergeL([0, 1, 2, 3].map(i => at(cylG(0.006, 0.006, 3.4, 4), Math.cos(i * 1.57) * 1.1, 1.6, Math.sin(i * 1.57) * 1.1, 0, 0, 0))), DARK, [0, H, 0], { tag: 'chute', hide: true })];
      break;
    case 'light':
      main = pbox(W, H, L * 0.8, 0, 0, -L * 0.1);
      subs = [sub(at(cylG(0.08, 0.08, 0.02, 16), 0, 0, 0, Math.PI / 2), glowMat(0x777766), [0, H / 2, hl - 0.03], { tag: 'lamp' }),
              sub(at(coneG(1.6, 9, 18), 0, -4.5, 0, Math.PI), BEAM, [0, H / 2, hl], { r: [Math.PI / 2, 0, 0], tag: 'beam', hide: true })];
      break;
    case 'beacon':
      main = pbox(W, H * 0.45, L);
      subs = [sub(sphG(0.09, 14, 8, Math.PI / 2), glowMat(0x772222), [0, H * 0.45, 0], { tag: 'lamp' })];
      break;
    case 'horn':
      main = pbox(W, H, L * 0.6, 0, 0, -L * 0.2);
      subs = [sub(at(cylG(0.03, 0.1, 0.14, 16), 0, 0, 0, Math.PI / 2), DARK, [0, H / 2, hl - 0.06])];
      break;
    case 'boost':
      main = pbox(W, H, L);
      subs = [sub(boxG(W + 0.004, 0.04, L * 0.8), glowMat(0x553311), [0, H * 0.6, 0], { tag: 'lamp' })];
      break;
    case 'smoke':
      main = at(cylG(hw * 0.85, hw * 0.85, H * 0.8, 18), 0, H * 0.4, 0);
      subs = [sub(cylG(0.04, 0.06, H * 0.2, 12), DARK, [0, H * 0.9, 0])];
      break;
    case 'laser':
      main = mergeL([pbox(W, H * 0.6, L * 0.5, 0, 0, -L * 0.25), at(cylG(0.035, 0.045, L * 0.6, 14), 0, H * 0.45, L * 0.2, Math.PI / 2)]);
      subs = [sub(sphG(0.04, 10, 8), glowMat(0x551111), [0, H * 0.45, hl - 0.01], { tag: 'lamp' })];
      break;
    case 'camera':
      main = pbox(W * 0.8, H, L * 0.8);
      subs = [sub(at(cylG(0.05, 0.05, 0.06, 16), 0, 0, 0, Math.PI / 2), DARK, [0, H / 2, L * 0.4 + 0.02])];
      break;
    case 'gyro':
      main = pbox(W, H * 0.3, L);
      subs = [sub(mergeL([torG(0.17, 0.015), at(torG(0.15, 0.015), 0, 0, 0, 0, Math.PI / 2)]), METAL, [0, H * 0.3 + 0.18, 0], { tag: 'spiny' })];
      break;
    case 'ballast':
      main = pbox(W, H, L);
      subs = [sub(boxG(W + 0.004, 0.03, L + 0.004), glowMat(0xfbc02d), [0, H * 0.75, 0])];
      break;
    case 'door':
      main = mergeL([pbox(0.03, H, L, -hw + 0.015), pbox(0.03, H, L, hw - 0.015), pbox(W, 0.03, L, 0, H - 0.03)]);
      subs = [sub(at(boxG(W - 0.07, H - 0.05, 0.05), (W - 0.07) / 2, 0, 0), 'paint', [-hw + 0.035, (H - 0.03) / 2, 0], { tag: 'door' })];
      break;
    case 'flap':
      main = pbox(W, 0.025, 0.06, 0, 0, -hl + 0.03);
      subs = [sub(at(boxG(W, 0.035, L - 0.06), 0, 0.0175, (L - 0.06) / 2), 'paint', [0, 0.01, -hl + 0.06], { tag: 'flapx' })];
      break;
    case 'piston':
      main = pbox(W * 0.8, H * 0.6, L * 0.8);
      subs = [sub(mergeL([at(cylG(0.035, 0.035, 0.5, 12), 0, -0.25, 0), at(boxG(0.16, 0.03, 0.16), 0, -0.5, 0)]), METAL, [0, 0.5 - 0.0, 0], { tag: 'piston' })];
      break;
    case 'gear': {
      main = pbox(W, 0.06, L, 0, H - 0.06);

const blocks = new Map();   // id -> block
const occ = new Map();      // "x,y,z" -> id
let nextId = 1;
const fp = (D, r) => (r & 1) ? [D.d, D.w] : [D.w, D.d];
const key = (x, y, z) => x + ',' + y + ',' + z;

function fits(type, gx, gy, gz, r, ignore) {
  const D = DEFS[type]; const [fw, fd] = fp(D, r);
  for (let x = 0; x < fw; x++) for (let z = 0; z < fd; z++) for (let y = 0; y < D.h; y++) {
    const o = occ.get(key(gx + x, gy + y, gz + z));
    if (o !== undefined && o !== ignore) return false;
  }

}
function setOcc(b, val) {
  const D = DEFS[b.type]; const [fw, fd] = fp(D, b.r);
  for (let x = 0; x < fw; x++) for (let z = 0; z < fd; z++) for (let y = 0; y < D.h; y++) {
    const k = key(b.gx + x, b.gy + y, b.gz + z);
    if (val === undefined) occ.delete(k); else occ.set(k, val);
  }
}
function placeMesh(b) {
  const [fw, fd] = fp(DEFS[b.type], b.r);
  b.mesh.position.set((b.gx + fw / 2) * S, b.gy * P, (b.gz + fd / 2) * S);
  b.mesh.rotation.set(0, b.r * Math.PI / 2, 0);
}
function addBlockRaw(d) {
  const D = DEFS[d.type]; if (!D) return null;
  const b = { id: d.id, type: d.type, gx: d.gx, gy: d.gy, gz: d.gz, r: d.r, color: d.color };
  b.mesh = partMesh(b.type, b.color);
  placeMesh(b); craft.add(b.mesh);
  blocks.set(b.id, b); setOcc(b, b.id);
  nextId = Math.max(nextId, b.id + 1);
  return b;
}
function removeBlockRaw(id) {
  const b = blocks.get(id); if (!b) return;
  setOcc(b, undefined); craft.remove(b.mesh); blocks.delete(id);
}
function setColorRaw(id, c) {
  const b = blocks.get(id); if (!b) return;
  b.color = c; paintMesh(b.mesh, c, DEFS[b.type].glass);
}
function clearAllRaw() { for (const id of [...blocks.keys()]) removeBlockRaw(id); }
const dataOf = b => ({ id: b.id, type: b.type, gx: b.gx, gy: b.gy, gz: b.gz, r: b.r, color: b.color });
const serialize = () => [...blocks.values()].map(dataOf);
const sameSpot = (a, b) => a.gx === b.gx && a.gy === b.gy && a.gz === b.gz && a.r === b.r && a.color === b.color;

function blockAt(local, margin = 0.03) {
  let best = null, bd = 1e9;
  for (const b of blocks.values()) {
    const D = DEFS[b.type]; const [fw, fd] = fp(D, b.r);
    const x0 = b.gx * S - margin, x1 = (b.gx + fw) * S + margin;
    const y0 = b.gy * P - margin, y1 = (b.gy + D.h) * P + margin;
    const z0 = b.gz * S - margin, z1 = (b.gz + fd) * S + margin;
    if (local.x >= x0 && local.x <= x1 && local.y >= y0 && local.y <= y1 && local.z >= z0 && local.z <= z1) {
      const d = (local.x - (x0 + x1) / 2) ** 2 + (local.y - (y0 + y1) / 2) ** 2 + (local.z - (z0 + z1) / 2) ** 2;
      if (d < bd) { bd = d; best = b; }
    }
  }
  return best;
}
function snapFor(type, r, bottomCenter) {
  const D = DEFS[type]; const [fw, fd] = fp(D, r);
  const gx = Math.round(bottomCenter.x / S - fw / 2);
  const gz = Math.round(bottomCenter.z / S - fd / 2);
  const gy = Math.round(bottomCenter.y / P);
  for (let k = 0; k < 80; k++) if (fits(type, gx, gy + k, gz, r)) return { gx, gy: gy + k, gz, r };
  return null;
}

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

}
function slotInfo(n) {

}
function saveSlot(n) {

  saveVersion++; sfx.pop(); toast(`Saved to Slot ${n}`);
}

}

  sfx.trash(); toast('New vehicle  (A to undo)');
}

const undoStack = [], redoStack = [];
function record(a) { wiresChanged(); undoStack.push(a); if (undoStack.length > 300) undoStack.shift(); redoStack.length = 0; autosave(); }
function applyAction(a, inv) {
  switch (a.t) {
    case 'add': inv ? removeBlockRaw(a.b.id) : addBlockRaw(a.b); break;
    case 'remove': inv ? addBlockRaw(a.b) : removeBlockRaw(a.b.id); break;
    case 'move': removeBlockRaw(a.b0.id); addBlockRaw(inv ? a.b0 : a.b1); break;
    case 'paint': setColorRaw(a.id, inv ? a.c0 : a.c1); break;
    case 'set': { clearAllRaw(); const st = inv ? a.before : a.after; st.b.forEach(addBlockRaw); wires = st.w.map(w => ({ ...w })); break; }
    case 'wire': case 'unwire': case 'wmode': applyWireAction(a, inv); break;
  }
  wiresChanged();
}
const anyHeld = () => hands.left.held || hands.right.held;
function undo() {
  if (anyHeld()) return;
  const a = undoStack.pop();
  if (!a) { sfx.err(); toast('Nothing to undo'); return; }
  applyAction(a, true); redoStack.push(a); autosave(); sfx.click(); toast('Undo');
}
function redo() {
  if (anyHeld()) return;
  const a = redoStack.pop();
  if (!a) { sfx.err(); toast('Nothing to redo'); return; }
  applyAction(a, false); undoStack.push(a); autosave(); sfx.click(); toast('Redo');
}

}
function tone(f, dur, type = 'sine', vol = 0.08, slide = 0, delay = 0) {

  const t = a.currentTime + delay;

  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}

function spawnVehicle() {

  v.quat.setFromAxisAngle(UP, Math.PI - Math.atan2(v.fwd.x, v.fwd.z));
  let low = 0;
  for (const c of v.contacts) low = Math.min(low, c.p.y);
  for (const w of v.wheels) low = Math.min(low, w.wc.y - w.R);
  v.pos.set(0, terrainH(0, 150) - low + 0.4, 150);
  v.vel.set(0, 0, 0); v.ang.set(0, 0, 0); v.toggles.clear();
  for (const p of v.parts) { p.ext = 0; p.spin = 0; }

}

const _hl = new THREE.Vector3();
function driveInput(v, dt) {
  const L = hands.left, R = hands.right;

  v.inputs.X = live && !!L.btn[4]; v.inputs.Y = live && !!L.btn[5]; v.inputs.A = live && !!R.btn[4]; v.inputs.B = live && !!R.btn[5];
  v.edge = { X: live && pressed(L, 4), Y: live && pressed(L, 5), A: live && pressed(R, 4), B: live && pressed(R, 5) };
  v.con.updateMatrixWorld(true);
  if (v.panel === 'STICK') {
    if (v.stickHand && !v.stickHand.btn[1]) v.stickHand = null;
    if (!v.stickHand) for (const h of HANDS) if (h.active && pressed(h, 1)) {
      v.con.worldToLocal(_hl.copy(h.pt));
      if (_hl.distanceTo(new THREE.Vector3(0, 0.19, 0)) < 0.13) { v.stickHand = h; v.stick0 = _hl.clone(); buzz(h, .4, 30); }
    }

        v.conWheel.worldToLocal(_hl.copy(h.pt));

}

function partActivation(v) {
  for (const p of v.parts) {
    let a = 0;
    for (const w of p.wires) {
      let val;
      if (w.input === 'STICK') val = Math.hypot(v.stick.x, v.stick.y) > 0.3 ? 1 : 0;
      else if (w.input === 'WHEEL') val = v.wheelIn.gas;
      else if (w.mode === 'toggle') { const k = p.d.id + ':' + w.input; if (v.edge[w.input]) v.toggles.set(k, !v.toggles.get(k)); val = v.toggles.get(k) ? 1 : 0; }

  for (let i = 0; i < 160; i++) { const m = new THREE.Mesh(sg, sm); m.visible = false; world.add(m); smokePool.push({ m, life: 0 }); }
  const bg = new THREE.BoxGeometry(0.07, 0.07, 2.4), bm = new THREE.MeshBasicMaterial({ color: 0xff3b3b });

const _zA = new THREE.Vector3(0, 0, 1), _d2 = T1(), _c5 = T1();
const ease = (cur, target, dt, k = 6) => cur + (target - cur) * (1 - Math.exp(-k * dt));

function driveFrame(dt) {
  const v = veh, L = hands.left;
  rig.updateMatrixWorld(true);
  for (const h of HANDS) if (h.active) { updateHandPose(h); h.tip.getWorldPosition(h.pt); }
  if (L.active && pressed(L, 3)) { v.menu = !v.menu; v.hudT = 0; sfx.click(); }
  if (v.menu) {
    if (pressed(L, 4)) { spawnVehicle(); v.menu = false; v.hudT = 0; toast('Respawned'); }

/* =========================================================
   MAIN LOOP
   ========================================================= */
let menuKey = '';
function xrFrame(dt) {
  readPad(hands.left); readPad(hands.right);
  if (mode === 'world' && veh) { driveFrame(dt); return; }
  locomotion(dt);
  rig.updateMatrixWorld(true);
  for (const h of HANDS) if (h.active) { updateHandPose(h); h.tip.getWorldPosition(h.pt); }
  for (const h of HANDS) if (h.active && h.craftGrab) updateCraftGrab(h);
  craft.updateMatrixWorld(true);

  const L = hands.left, R = hands.right;
  if (L.active) { if (pressed(L, 5)) toggleMenu(); if (pressed(L, 4)) cycleTool(); }
  if (R.active) { if (pressed(R, 4)) undo(); if (pressed(R, 5)) redo(); }

  for (const h of HANDS) {
    if (h.active) interact(h);
    else {
      if (h.held) release(h);
      h.craftGrab = null; h.hover = null; h.hl.visible = false;
    }
  }
  const trashing = (L.held && L.held.inTrash) || (R.held && R.held.inTrash);
  binRimMat.emissive.setHex(trashing ? 0x7a1010 : 0x000000);
  wireFrame();

  if (menu.visible) {
    const k = `${activeTab}|${L.hover}|${R.hover}|${tool}|${wireVersion}|${currentColor}|${saveVersion}|${undoStack.length}`;
    if (k !== menuKey) { menuKey = k; drawMenu(); }
  }
}

const info = document.getElementById('info');
renderer.xr.addEventListener('sessionstart', () => {

renderer.xr.addEventListener('sessionend', () => {

  info.style.display = '';
  rig.position.set(0, 0, 0); rig.rotation.set(0, 0, 0);
  camera.position.set(0, 1.6, 0.8); orbit.enabled = true; orbit.update();
  menu.visible = false;
});
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// load last session (or a starter chassis plate)
(function loadInitial() {
  const raw = lsGet('vck2_auto'); let ok = false;
  if (raw) {
    try {
      const o = JSON.parse(raw);

      wires = (o.wires || []).map(w => ({ ...w }));
      if (o.craft) { craft.position.set(o.craft[0], o.craft[1], o.craft[2]); craft.rotation.y = o.craft[3]; }

})();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (menu.visible && previewGroups[activeTab]) previewGroups[activeTab].children.forEach(hd => { hd.children[0].rotation.y += dt * 0.7; });
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastMesh.visible = false; }
