<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sludge Slop</title>
<style>
  html, body { margin: 0; height: 100%; background: #10150d; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e9f5c9; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; top: 14px; pointer-events: none; text-shadow: 0 2px 6px #000; max-width: 70vw; }
  #hud h1 { margin: 0; font-size: 26px; letter-spacing: 3px; color: #b6ff4a; }
  #hud p { margin: 6px 0 0; font-size: 13px; opacity: .88; line-height: 1.5; }
  #status { position: fixed; left: 12px; bottom: 10px; max-width: 62vw; font: 12px/1.4 ui-monospace, Menlo, monospace;
    color: #ffd9a0; white-space: pre-wrap; pointer-events: none; text-shadow: 0 1px 3px #000; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    padding: 24px; background: #10150d; color: #ffb3a8; font-size: 16px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="hud">
  <h1>SLUDGE SLOP</h1>
  <p id="hudtext">Desktop preview: WASD to walk, Space to jump, drag to look around, scroll to zoom.<br>
  On a Quest 3: open this page in the Meta Quest Browser and press ENTER VR.</p>
</div>
<div id="status"></div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';

/* ---------- on-screen diagnostics (page + inside the headset) ---------- */
const statusEl = document.getElementById('status');
const logLines = [];
let vrPanelUpdate = null;
const seenMsgs = new Set();
function report(msg, isErr = false) {
  console[isErr ? 'error' : 'log'](msg);
  logLines.push((isErr ? '! ' : '') + msg);
  while (logLines.length > 7) logLines.shift();
  statusEl.textContent = logLines.join('\n');
  if (vrPanelUpdate) vrPanelUpdate(isErr);
}
function reportOnce(msg) { if (!seenMsgs.has(msg)) { seenMsgs.add(msg); report(msg, true); } }
window.addEventListener('error', (e) => reportOnce('Error: ' + e.message));
window.addEventListener('unhandledrejection', (e) => reportOnce('Promise error: ' + ((e.reason && e.reason.message) || e.reason)));

if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr')
    .then(ok => report(ok ? 'VR supported. Press ENTER VR.' : 'VR NOT supported by this browser. Use the Meta Quest Browser on an https link.', !ok))
    .catch(e => report('VR check failed: ' + e.message, true));
  const origRequest = navigator.xr.requestSession.bind(navigator.xr);   // surface the reason if the headset refuses the session
  navigator.xr.requestSession = (...args) => origRequest(...args).catch(e => { reportOnce('VR session refused: ' + e.name + ' ' + e.message); throw e; });
} else {
  report('WebXR is not available here. Open this page in the Meta Quest Browser.', true);
}

/* =====================================================================
   SLUDGE SLOP  -  v0.1  (avatar + spawn island + Gorilla Tag movement)
   ===================================================================== */

/* ---------- tuning ---------- */
const BODY_DROP = 0.35;      // virtual body sits this far below your real floor so your hands can reach the ground
const ARM_SCALE = 1.3;       // how much longer your virtual arms are than your real ones
const HAND_R = 0.07;         // hand collision radius
const RELEASE = 0.025;       // how far a hand must lift off a surface to let go
const GRAVITY = 9.8;
const AIR_DRAG = 0.15;
const GROUND_FRICTION = 6;
const MAX_SPEED = 9;
const JUMP_MULT = 1.15;      // launch boost when you release a push
const GROUND_R = 18;         // radius of the spawn island
const SPAWN = new THREE.Vector3(0, 0, 2.5);
const MIRROR_Z = -1.5;       // z of the mirror plane
const SNAP_DEG = 30;

const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

try {

/* =====================================================================
   Renderer / scene
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);
{
  const origSetSession = renderer.xr.setSession.bind(renderer.xr);       // surface renderer-side failures when entering VR
  renderer.xr.setSession = (s) => origSetSession(s).catch(e => { reportOnce('Entering VR failed: ' + e.message); throw e; });
}
document.body.appendChild(VRButton.createButton(renderer));

const scene = new THREE.Scene();
const FOG = 0x55652f;
scene.background = new THREE.Color(FOG);
scene.fog = new THREE.Fog(FOG, 25, 95);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.05, 400);
scene.add(camera);                       // preview mode: camera lives in the scene
const rig = new THREE.Group();           // VR mode: camera + controllers live in the rig, moving the rig moves the player
scene.add(rig);

scene.add(new THREE.HemisphereLight(0xd6e8a4, 0x2b2a1a, 1.0));
const sun = new THREE.DirectionalLight(0xfff0c0, 1.2);
sun.position.set(-8, 14, 6);
scene.add(sun);

/* =====================================================================
   Procedural textures
   ===================================================================== */
function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function canvasTex(c, repeat) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
  t.anisotropy = 4;
  return t;
}
// marker-scribble fill, like the drawing
function scribble(w, h, seed, base, tones, count, width = [6, 18]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const r = rng(seed);
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < count; i++) {
    g.strokeStyle = tones[(r() * tones.length) | 0];
    g.globalAlpha = 0.3 + r() * 0.4;
    g.lineWidth = width[0] + r() * (width[1] - width[0]);
    let x = r() * w, y = r() * h; const a = r() * 6.28, len = 30 + r() * 90;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      x += Math.cos(a + (k % 2 ? 0.9 : -0.9)) * len / 3; y += Math.sin(a + (k % 2 ? 0.9 : -0.9)) * len / 3;
      g.lineTo(x, y);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
  return c;
}
const SKIN_BASE = '#e9726f', SKIN_TONES = ['#f48f8a', '#d85b5b', '#f6a39d', '#e2625f'];

const SKIN_TEX = canvasTex(scribble(256, 256, 11, SKIN_BASE, SKIN_TONES, 140));

const FACE_TEX = (() => {
  const W = 1024, H = 512;
  const c = scribble(W, H, 7, SKIN_BASE, SKIN_TONES, 300);
  const g = c.getContext('2d');
  const cx = W * 0.75, cy = H * 0.5;          // u = 0.75 is the -Z (forward) side of a three.js sphere
  g.lineCap = 'round'; g.lineJoin = 'round';
  const eye = (ex) => {
    g.fillStyle = '#0b0b0b'; g.beginPath(); g.ellipse(ex, cy - 34, 50, 58, 0, 0, 7); g.fill();
    g.fillStyle = '#2f9e3a'; g.beginPath(); g.ellipse(ex, cy - 34, 37, 45, 0, 0, 7); g.fill();
    g.strokeStyle = '#86dd6e'; g.lineWidth = 6; g.beginPath(); g.arc(ex + 3, cy - 38, 24, 3.5, 5.3); g.stroke();
    g.strokeStyle = '#1f6d28'; g.lineWidth = 5; g.beginPath(); g.arc(ex, cy - 30, 28, 0.4, 2.4); g.stroke();
  };
  eye(cx - 82); eye(cx + 82);
  g.strokeStyle = '#0b0b0b'; g.lineWidth = 9;                       // nose slashes
  g.beginPath(); g.moveTo(cx - 34, cy + 6); g.lineTo(cx - 20, cy + 32); g.stroke();
  g.beginPath(); g.moveTo(cx + 34, cy + 2); g.lineTo(cx + 22, cy + 26); g.stroke();
  g.lineWidth = 13;                                                  // flat frown
  g.beginPath(); g.moveTo(cx - 64, cy + 94); g.quadraticCurveTo(cx, cy + 76, cx + 64, cy + 94); g.stroke();
  return canvasTex(c);
})();

const PLATE_TEX = (() => {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#0d0d0d'; g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#d8261c'; g.fillRect(14, 12, 228, 14);
  g.fillStyle = '#cfcfcf';
  for (let r = 0; r < 2; r++) for (let k = 0; k < 9; k++) g.fillRect(14 + k * 25.5, 44 + r * 38, 18, 26);
  return canvasTex(c);
})();

/* =====================================================================
   Avatar: the "Sludge Monkey"
   Everything is built from simple shapes + a black outline (inverted hull)
   to match the marker drawing. It is driven by a plain pose
   (head position/rotation + two hand positions) so the same pose can be
   sent over the network later.
   ===================================================================== */
function makeMaterials(clip) {
  const m = {
    skin: new THREE.MeshLambertMaterial({ map: SKIN_TEX }),
    head: new THREE.MeshLambertMaterial({ map: FACE_TEX }),
    black: new THREE.MeshLambertMaterial({ color: 0x161616 }),
    plate: new THREE.MeshLambertMaterial({ map: PLATE_TEX }),
    outline: new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }),
  };
  m.outline.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n transformed += normalize(normal) * 0.011;');
  };
  if (clip) for (const k in m) m[k].clippingPlanes = clip;
  return m;
}
function part(geo, mat, outlineMat, parent, pos) {
  const mesh = new THREE.Mesh(geo, mat);
  if (outlineMat) mesh.add(new THREE.Mesh(geo, outlineMat));
  if (pos) mesh.position.copy(pos);
  if (parent) parent.add(mesh);
  return mesh;
}
const lathe = (pts, seg = 32) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);
function limbGeo(rStart, rEnd) {           // cylinder that runs from y=0 to y=1
  const g = new THREE.CylinderGeometry(rEnd, rStart, 1, 20, 1);
  g.translate(0, 0.5, 0);
  return g;
}

const ARM_L1 = 0.38, ARM_L2 = 0.38, TORSO_H = 0.67, HEAD_R = 0.15;
const GEO = {
  head: new THREE.SphereGeometry(HEAD_R, 40, 28),
  neck: new THREE.CylinderGeometry(0.075, 0.09, 0.2, 14),
  torso: lathe([[0, 0], [0.17, 0], [0.22, 0.06], [0.235, 0.18], [0.25, 0.30], [0.30, 0.44], [0.345, 0.55],
                [0.315, 0.62], [0.20, 0.655], [0.09, 0.67], [0, 0.67]]),
  pants: lathe([[0, -0.09], [0.1, -0.085], [0.18, -0.04], [0.235, 0.06], [0.248, 0.16], [0.242, 0.21]]),
  plate: new THREE.BoxGeometry(0.17, 0.085, 0.03),
  upper: limbGeo(0.115, 0.095),
  fore: limbGeo(0.10, 0.066),
  ball: new THREE.SphereGeometry(1, 20, 14),
  palm: new THREE.SphereGeometry(0.075, 18, 14),
  finger: [0.065, 0.078, 0.065].map(l => new THREE.CapsuleGeometry(0.019, l, 4, 10)),
  thumb: new THREE.CapsuleGeometry(0.021, 0.05, 4, 10),
  band: new THREE.CylinderGeometry(0.108, 0.112, 0.035, 20),
};

function makeHand(M, side) {
  const g = new THREE.Group();
  const palm = part(GEO.palm, M.skin, M.outline, g, V3(0, 0.055, 0));
  palm.scale.set(1.2, 1.0, 0.8);
  const fingers = [];
  [-0.046, 0, 0.046].forEach((x, i) => {
    const piv = new THREE.Group(); piv.position.set(x, 0.1, 0); g.add(piv);
    const len = [0.065, 0.078, 0.065][i];
    part(GEO.finger[i], M.skin, M.outline, piv, V3(0, len / 2 + 0.012, 0));
    fingers.push(piv);
  });
  const thumb = new THREE.Group();
  thumb.position.set(side < 0 ? 0.07 : -0.07, 0.04, 0);
  thumb.rotation.z = side < 0 ? -0.85 : 0.85;
  g.add(thumb);
  part(GEO.thumb, M.skin, M.outline, thumb, V3(0, 0.04, 0));
  g.userData = { fingers, thumb, side };
  return g;
}

function makeArm(M, side) {
  const arm = {
    side,
    shoulder: part(GEO.ball, M.skin, M.outline, null),
    upper: new THREE.Group(), fore: new THREE.Group(), elbow: null, wrist: null, hand: makeHand(M, side),
    upperMesh: part(GEO.upper, M.skin, M.outline, null),
    foreMesh: part(GEO.fore, M.skin, M.outline, null),
  };
  arm.shoulder.scale.setScalar(0.125);
  arm.upperMesh.scale.y = ARM_L1; arm.upper.add(arm.upperMesh);
  const band = part(GEO.band, M.black, null, arm.upper, V3(0, ARM_L1 * 0.55, 0));
  arm.elbow = part(GEO.ball, M.skin, M.outline, arm.fore); arm.elbow.scale.setScalar(0.1);
  arm.fore.add(arm.foreMesh);
  arm.wrist = part(GEO.ball, M.skin, M.outline, arm.hand); arm.wrist.scale.setScalar(0.068);
  return arm;
}

const _tmp = {
  a: V3(), b: V3(), c: V3(), d: V3(), e: V3(), f: V3(), fwd: V3(), right: V3(), pole: V3(), perp: V3(),
  x: V3(), y: V3(), z: V3(), m: new THREE.Matrix4(), q: new THREE.Quaternion(), up: V3(0, 1, 0),
};
const Y_AXIS = V3(0, 1, 0);

function makeAvatar(clip) {
  const M = makeMaterials(clip);
  const root = new THREE.Group();

  // head + neck (head is hidden for the local player in VR)
  const headG = new THREE.Group(); root.add(headG);
  const head = part(GEO.head, M.head, M.outline, headG);
  const body = new THREE.Group(); root.add(body);
  const neck = part(GEO.neck, M.skin, M.outline, body, V3(0, TORSO_H + 0.04, 0));
  const torso = part(GEO.torso, M.skin, M.outline, body); torso.scale.z = 0.62;
  const pants = part(GEO.pants, M.black, M.outline, body); pants.scale.z = 0.7;
  part(GEO.plate, M.plate, null, body, V3(0, 0.43, -0.178));
  const arms = [makeArm(M, -1), makeArm(M, 1)];
  for (const a of arms) root.add(a.shoulder, a.upper, a.fore, a.hand);

  root.traverse(o => { o.frustumCulled = false; });   // arms are repositioned every frame; skip culling, it's only a few meshes
  const av = { root, headG, body, arms, yaw: 0, first: true, headVisible: true };
  av.setHeadVisible = (v) => { av.headVisible = v; headG.visible = v; neck.visible = v; };

  av.update = function (dt, headPos, headQuat, lPos, rPos, curlL = 0, curlR = 0) {
    const t = _tmp;
    headG.position.copy(headPos); headG.quaternion.copy(headQuat);

    // heading from the head (falls back to the up vector when looking straight up/down)
    t.fwd.set(0, 0, -1).applyQuaternion(headQuat);
    if (Math.hypot(t.fwd.x, t.fwd.z) < 0.35) {
      t.a.set(0, 1, 0).applyQuaternion(headQuat);
      const s = t.fwd.y < 0 ? 1 : -1; t.fwd.set(t.a.x * s, 0, t.a.z * s);
    }
    const targetYaw = Math.atan2(-t.fwd.x, -t.fwd.z);
    if (av.first) { av.yaw = targetYaw; av.first = false; }
    let d = targetYaw - av.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
    av.yaw += d * Math.min(1, dt * 6);
    body.rotation.set(0, av.yaw, 0);
    t.fwd.set(-Math.sin(av.yaw), 0, -Math.cos(av.yaw));
    body.position.set(headPos.x, headPos.y - HEAD_R - TORSO_H - 0.04, headPos.z).addScaledVector(t.fwd, -0.03);
    body.updateMatrixWorld(true);

    solveArm(arms[0], lPos, curlL);
    solveArm(arms[1], rPos, curlR);
  };

  function solveArm(arm, target, curl) {
    const t = _tmp, side = arm.side;
    const sh = t.a.set(side * 0.37, 0.57, 0); body.localToWorld(sh);          // shoulder (world)
    t.right.set(1, 0, 0).applyQuaternion(body.quaternion);
    t.fwd.set(0, 0, -1).applyQuaternion(body.quaternion);

    // hand origin (wrist) sits slightly behind the palm centre
    t.b.copy(target).sub(sh); const dist0 = t.b.length() || 1e-4; t.b.divideScalar(dist0);
    const wrist = t.c.copy(target).addScaledVector(t.b, -0.06);

    // two-bone IK (forearm stretches if the target is out of reach)
    const dv = t.d.copy(wrist).sub(sh); let dist = dv.length(); const dir = dv.divideScalar(dist || 1e-4);
    const reach = ARM_L1 + ARM_L2;
    const a = THREE.MathUtils.clamp(dist, 0.05, reach - 1e-4);
    const cosA = THREE.MathUtils.clamp((ARM_L1 * ARM_L1 + a * a - ARM_L2 * ARM_L2) / (2 * ARM_L1 * a), -1, 1);
    const ang = Math.acos(cosA);
    t.pole.set(0, -0.55, 0).addScaledVector(t.right, side * 0.8).addScaledVector(t.fwd, -0.45);
    t.perp.copy(t.pole).addScaledVector(dir, -t.pole.dot(dir));
    if (t.perp.lengthSq() < 1e-6) t.perp.set(0, -1, 0);
    t.perp.normalize();
    const elbow = t.e.copy(sh).addScaledVector(dir, ARM_L1 * Math.cos(ang)).addScaledVector(t.perp, ARM_L1 * Math.sin(ang));
    let foreLen = ARM_L2;
    if (dist > reach) { elbow.copy(sh).addScaledVector(dir, ARM_L1); foreLen = dist - ARM_L1; }

    arm.shoulder.position.copy(sh);
    arm.upper.position.copy(sh);
    t.f.copy(elbow).sub(sh).normalize();
    arm.upper.quaternion.setFromUnitVectors(Y_AXIS, t.f);
    arm.fore.position.copy(elbow);
    t.f.copy(wrist).sub(elbow); const fl = t.f.length() || 1e-4; t.f.divideScalar(fl);
    arm.fore.quaternion.setFromUnitVectors(Y_AXIS, t.f);
    arm.foreMesh.scale.y = foreLen;

    // hand: fingers along the forearm, palm facing inward
    arm.hand.position.copy(wrist);
    const Yh = t.y.copy(t.f);
    const Xh = t.x.copy(t.fwd).multiplyScalar(side < 0 ? 1 : -1);
    Xh.addScaledVector(Yh, -Xh.dot(Yh));
    if (Xh.lengthSq() < 1e-4) Xh.copy(t.right).multiplyScalar(side);
    Xh.normalize();
    const Zh = t.z.crossVectors(Xh, Yh);
    t.m.makeBasis(Xh, Yh, Zh); arm.hand.quaternion.setFromRotationMatrix(t.m);
    const fingers = arm.hand.userData.fingers;
    for (const f of fingers) f.rotation.x = -curl * 1.55;
    arm.hand.userData.thumb.rotation.x = -curl * 0.7;
  }

  return av;
}

/* =====================================================================
   World: sky, spawn island, props, colliders
   ===================================================================== */
const boxes = [];     // axis-aligned boxes
const spheres = [];   // sphere colliders (rocks, boulders)
function addBox(cx, cy, cz, w, h, d) { boxes.push({ min: V3(cx - w / 2, cy - h / 2, cz - d / 2), max: V3(cx + w / 2, cy + h / 2, cz + d / 2) }); }
function addSphere(x, y, z, r) { spheres.push({ c: V3(x, y, z), r }); }

(function buildWorld() {
  // sky dome
  const sky = new THREE.SphereGeometry(220, 24, 16);
  const col = [], top = new THREE.Color(0x16231f), hor = new THREE.Color(0x73843c), tmp = new THREE.Color();
  const p = sky.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const k = THREE.MathUtils.clamp(p.getY(i) / 220, 0, 1);
    tmp.copy(hor).lerp(top, Math.pow(k, 0.55)); col.push(tmp.r, tmp.g, tmp.b);
  }
  sky.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(sky, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false })));

  // ground
  const gc = scribble(512, 512, 3, '#4a4d2a', ['#3a3d20', '#5c5f33', '#44502a', '#2f3a1f'], 420, [10, 34]);
  const gtex = canvasTex(gc, 9);
  const ground = new THREE.Mesh(new THREE.CircleGeometry(GROUND_R, 72), new THREE.MeshLambertMaterial({ map: gtex }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const side = new THREE.Mesh(new THREE.CylinderGeometry(GROUND_R, GROUND_R - 1.5, 6, 72, 1, true),
    new THREE.MeshLambertMaterial({ color: 0x2e2a1a, side: THREE.DoubleSide }));
  side.position.y = -3; scene.add(side);

  // glowing sludge puddles
  const pm = new THREE.MeshBasicMaterial({ color: 0x8dff4a, transparent: true, opacity: 0.55 });
  [[6, 5, 1.6], [-7, 6, 2.2], [9, -2, 1.2], [-3, -10, 2.6], [2, 11, 1.4], [-11, -2, 1.8]].forEach(([x, z, r]) => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 28), pm);
    m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, z); scene.add(m);
  });

  // boulder ring so you can't just walk off the edge
  const rockMat = new THREE.MeshLambertMaterial({ color: 0x6b6a5a, flatShading: true });
  const r2 = rng(99);
  for (let i = 0; i < 30; i++) {
    const a = (i / 30) * Math.PI * 2, rad = 1.5 + r2() * 0.7;
    const x = Math.cos(a) * (GROUND_R + 0.2), z = Math.sin(a) * (GROUND_R + 0.2), y = rad * 0.35;
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(rad, 1), rockMat);
    m.position.set(x, y, z); m.rotation.set(r2() * 3, r2() * 3, r2() * 3); scene.add(m);
    addSphere(x, y, z, rad);
  }
  // a few climbable rocks inside
  [[-6, -6, 1.3], [5.5, -9, 1.0], [-10, 4, 1.5]].forEach(([x, z, r]) => {
    const y = r * 0.3, m = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), rockMat);
    m.position.set(x, y, z); m.rotation.set(r * 2, r, 0); scene.add(m); addSphere(x, y, z, r);
  });

  // crates / steps
  const cc = document.createElement('canvas'); cc.width = cc.height = 128;
  const cg = cc.getContext('2d');
  cg.fillStyle = '#8a6334'; cg.fillRect(0, 0, 128, 128);
  cg.strokeStyle = '#3d2a14'; cg.lineWidth = 10; cg.strokeRect(5, 5, 118, 118);
  cg.lineWidth = 8; cg.beginPath(); cg.moveTo(8, 8); cg.lineTo(120, 120); cg.moveTo(120, 8); cg.lineTo(8, 120); cg.stroke();
  const crateMat = new THREE.MeshLambertMaterial({ map: canvasTex(cc) });
  const crate = (x, y, z, w, h, d) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), crateMat);
    m.position.set(x, y, z); scene.add(m); addBox(x, y, z, w, h, d);
  };
  crate(7, 0.25, -5, 1.4, 0.5, 1.4);
  crate(8.4, 0.5, -5, 1.4, 1.0, 1.4);
  crate(9.8, 0.75, -5, 1.4, 1.5, 1.4);
  crate(-3, 0.4, 7, 0.8, 0.8, 0.8);
  crate(-2.1, 0.4, 7.2, 0.8, 0.8, 0.8);
  crate(-2.6, 1.2, 7.1, 0.8, 0.8, 0.8);
  crate(4, 0.3, 9, 1.0, 0.6, 1.0);

  // ruin wall + pillar to climb
  const conc = new THREE.MeshLambertMaterial({ color: 0x7c7f74 });
  const wall = new THREE.Mesh(new THREE.BoxGeometry(5, 3.2, 0.5), conc);
  wall.position.set(-9, 1.6, -7); scene.add(wall); addBox(-9, 1.6, -7, 5, 3.2, 0.5);
  const pil = new THREE.Mesh(new THREE.BoxGeometry(0.7, 2.2, 0.7), conc);
  pil.position.set(-5.5, 1.1, -9.5); scene.add(pil); addBox(-5.5, 1.1, -9.5, 0.7, 2.2, 0.7);

  // mirror frame
  const metal = new THREE.MeshLambertMaterial({ color: 0x2b2e2b });
  const fb = (x, y, w, h) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.3), metal);
    m.position.set(x, y, MIRROR_Z); scene.add(m); addBox(x, y, MIRROR_Z, w, h, 0.3);
  };
  fb(-1.7, 1.35, 0.2, 2.7); fb(1.7, 1.35, 0.2, 2.7); fb(0, 2.75, 3.6, 0.2); fb(0, 0.1, 3.6, 0.2);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(3.2, 2.6),
    new THREE.MeshBasicMaterial({ color: 0xa6e0cf, transparent: true, opacity: 0.1, depthWrite: false }));
  glass.position.set(0, 1.4, MIRROR_Z + 0.02); scene.add(glass);
  const shine = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 2.6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.07, depthWrite: false }));
  shine.position.set(-0.8, 1.4, MIRROR_Z + 0.03); shine.rotation.z = 0.25; scene.add(shine);

  // title sign above the mirror
  const sc = document.createElement('canvas'); sc.width = 1024; sc.height = 256;
  const sg = sc.getContext('2d');
  sg.fillStyle = '#10150d'; sg.fillRect(0, 0, 1024, 256);
  sg.strokeStyle = '#b6ff4a'; sg.lineWidth = 10; sg.strokeRect(10, 10, 1004, 236);
  sg.fillStyle = '#b6ff4a'; sg.font = '900 150px Impact, "Arial Black", sans-serif';
  sg.textAlign = 'center'; sg.textBaseline = 'middle'; sg.shadowColor = '#7dff3a'; sg.shadowBlur = 30;
  sg.fillText('SLUDGE SLOP', 512, 136);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), new THREE.MeshBasicMaterial({ map: canvasTex(sc), side: THREE.DoubleSide }));
  sign.position.set(0, 4.0, MIRROR_Z - 0.2); scene.add(sign);
  [-2.8, 2.8].forEach(x => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.25, 3.3, 0.25), metal);
    post.position.set(x, 1.65, MIRROR_Z - 0.2); scene.add(post); addBox(x, 1.65, MIRROR_Z - 0.2, 0.25, 3.3, 0.25);
  });
})();

/* =====================================================================
   Collision
   ===================================================================== */
const clamp = THREE.MathUtils.clamp;
// Pushes sphere (p, r) out of the world. Returns true if it was touching something; nOut = contact normal.
function pushOut(p, r, nOut) {
  let hit = false;
  if (Math.hypot(p.x, p.z) < GROUND_R + 0.05 && p.y < r && p.y > -1.5) {
    p.y = r; nOut.set(0, 1, 0); hit = true;
  }
  for (const b of boxes) {
    const cx = clamp(p.x, b.min.x, b.max.x), cy = clamp(p.y, b.min.y, b.max.y), cz = clamp(p.z, b.min.z, b.max.z);
    const dx = p.x - cx, dy = p.y - cy, dz = p.z - cz, d2 = dx * dx + dy * dy + dz * dz;
    if (d2 >= r * r) continue;
    if (d2 > 1e-10) {
      const d = Math.sqrt(d2), k = (r - d) / d;
      p.x += dx * k; p.y += dy * k; p.z += dz * k; nOut.set(dx / d, dy / d, dz / d);
    } else {                                   // centre is inside the box: leave through the nearest face
      const f = [p.x - b.min.x, b.max.x - p.x, p.y - b.min.y, b.max.y - p.y, p.z - b.min.z, b.max.z - p.z];
      let mi = 0; for (let i = 1; i < 6; i++) if (f[i] < f[mi]) mi = i;
      nOut.set(0, 0, 0);
      switch (mi) {
        case 0: p.x = b.min.x - r; nOut.x = -1; break; case 1: p.x = b.max.x + r; nOut.x = 1; break;
        case 2: p.y = b.min.y - r; nOut.y = -1; break; case 3: p.y = b.max.y + r; nOut.y = 1; break;
        case 4: p.z = b.min.z - r; nOut.z = -1; break; default: p.z = b.max.z + r; nOut.z = 1;
      }
    }
    hit = true;
  }
  for (const s of spheres) {
    const dx = p.x - s.c.x, dy = p.y - s.c.y, dz = p.z - s.c.z, d = Math.hypot(dx, dy, dz), R = s.r + r;
    if (d >= R) continue;
    if (d > 1e-6) { const k = (R - d) / d; p.x += dx * k; p.y += dy * k; p.z += dz * k; nOut.set(dx / d, dy / d, dz / d); }
    else { p.y += R; nOut.set(0, 1, 0); }
    hit = true;
  }
  return hit;
}

/* =====================================================================
   Avatars in the scene (you + the mirror reflection)
   ===================================================================== */
const MIRROR_W = 1.6;
const mirrorClip = [
  new THREE.Plane(V3(0, 0, -1), MIRROR_Z),     // only keep what is behind the glass
  new THREE.Plane(V3(1, 0, 0), MIRROR_W),
  new THREE.Plane(V3(-1, 0, 0), MIRROR_W),
  new THREE.Plane(V3(0, 1, 0), -0.12),
  new THREE.Plane(V3(0, -1, 0), 2.65),
];
const avatar = makeAvatar(null);
const mirrorAvatar = makeAvatar(mirrorClip);
scene.add(avatar.root, mirrorAvatar.root);

const pose = { head: V3(0, 1.25, 0), q: new THREE.Quaternion(), l: V3(), r: V3(), cl: 0, cr: 0 };

function reflectPos(p, out) { return out.set(p.x, p.y, 2 * MIRROR_Z - p.z); }
const _mh = V3(), _ml = V3(), _mr = V3(), _mq = new THREE.Quaternion();
function updateMirror(dt) {
  reflectPos(pose.head, _mh); reflectPos(pose.r, _ml); reflectPos(pose.l, _mr);   // mirror image swaps left/right
  const f = _tmp.a.set(0, 0, -1).applyQuaternion(pose.q); f.z *= -1;
  const u = _tmp.b.set(0, 1, 0).applyQuaternion(pose.q); u.z *= -1;
  const zax = _tmp.c.copy(f).negate();
  const xax = _tmp.d.crossVectors(u, zax).normalize();
  _tmp.m.makeBasis(xax, u, zax); _mq.setFromRotationMatrix(_tmp.m);
  mirrorAvatar.update(dt, _mh, _mq, _ml, _mr, pose.cr, pose.cl);
}

/* =====================================================================
   VR input + Gorilla Tag locomotion
   ===================================================================== */
const ctrls = [renderer.xr.getController(0), renderer.xr.getController(1)];
const grips = [renderer.xr.getControllerGrip(0), renderer.xr.getControllerGrip(1)];
ctrls.forEach((c, i) => {
  c.userData.hand = null; c.userData.input = null;
  c.addEventListener('connected', (e) => { c.userData.hand = e.data.handedness; c.userData.input = e.data; });
  c.addEventListener('disconnected', () => { c.userData.hand = null; c.userData.input = null; });
  rig.add(c, grips[i]);
});

const hands = [0, 1].map(() => ({
  touch: false, anchor: V3(), normal: V3(0, 1, 0), world: V3(), vis: V3(), local: V3(), have: false,
}));
const loco = { vel: V3(), hist: [], wasTouch: false, onGround: false, turnLatch: false, clock: 0 };
const _a = V3(), _b = V3(), _c = V3(), _n = V3(), _d = V3();

function respawn() {
  rig.position.set(SPAWN.x, SPAWN.y - BODY_DROP, SPAWN.z);
  rig.rotation.set(0, 0, 0);
  loco.vel.set(0, 0, 0); loco.hist.length = 0; loco.wasTouch = false;
  hands.forEach(h => { h.touch = false; });
  rig.updateMatrixWorld(true);
}

// Hands stick to whatever they touch. While stuck, your body moves so the hand stays put,
// so pulling yourself along the ground / up a wall / off a rock works like Gorilla Tag.
function stepLocomotion(dt, headL, handL) {
  loco.clock += dt;
  rig.updateMatrixWorld(true);
  const before = _d.copy(rig.position);
  let touch = false;

  for (let i = 0; i < 2; i++) {
    const h = hands[i];
    h.world.copy(handL[i]); rig.localToWorld(h.world);
    if (h.touch) {
      const sep = _a.copy(h.world).sub(h.anchor).dot(h.normal);
      if (sep > RELEASE) h.touch = false;
      else {
        rig.position.add(_b.copy(h.anchor).sub(h.world)); rig.updateMatrixWorld(true);
        touch = true; continue;
      }
    }
    _c.copy(h.world);
    if (pushOut(_c, HAND_R, _n)) {
      h.touch = true; h.anchor.copy(_c); h.normal.copy(_n);
      rig.position.add(_b.copy(_c).sub(h.world)); rig.updateMatrixWorld(true);
      touch = true;
    }
  }

  // velocity bookkeeping: remember how fast the hands moved the body, launch on release
  const delta = _a.copy(rig.position).sub(before);
  if (touch) {
    loco.vel.set(0, 0, 0);
    loco.hist.push({ v: delta.clone().divideScalar(Math.max(dt, 1e-3)), t: loco.clock });
    while (loco.hist.length && loco.clock - loco.hist[0].t > 0.1) loco.hist.shift();
  } else if (loco.wasTouch && loco.hist.length) {
    const avg = V3(); loco.hist.forEach(e => avg.add(e.v)); avg.divideScalar(loco.hist.length).multiplyScalar(JUMP_MULT);
    if (avg.length() > MAX_SPEED) avg.setLength(MAX_SPEED);
    loco.vel.copy(avg); loco.hist.length = 0;
  }
  loco.wasTouch = touch;

  // free movement
  if (!touch) {
    loco.vel.y -= GRAVITY * dt;
    const dr = Math.exp(-AIR_DRAG * dt); loco.vel.x *= dr; loco.vel.z *= dr;
    loco.vel.y = Math.max(loco.vel.y, -25);
    rig.position.addScaledVector(loco.vel, dt);
    rig.updateMatrixWorld(true);
  }

  // body collision: feet, chest, head
  loco.onGround = false;
  const spots = [[headL.x, BODY_DROP + 0.15, headL.z, 0.15, true], [headL.x, headL.y - 0.45, headL.z, 0.22, false],
                 [headL.x, headL.y, headL.z, 0.16, false]];
  for (const s of spots) {
    _c.set(s[0], s[1], s[2]); rig.localToWorld(_c);
    _b.copy(_c);
    if (pushOut(_c, s[3], _n)) {
      rig.position.add(_a.copy(_c).sub(_b)); rig.updateMatrixWorld(true);
      const vn = loco.vel.dot(_n); if (vn < 0) loco.vel.addScaledVector(_n, -vn);
      if (_n.y > 0.6) loco.onGround = true;
    }
  }
  if (loco.onGround && !touch) { const f = Math.exp(-GROUND_FRICTION * dt); loco.vel.x *= f; loco.vel.z *= f; }
  if (rig.position.y < -30) respawn();
}

function snapTurn(deg) {
  rig.updateMatrixWorld(true);
  const hp = rig.localToWorld(camera.position.clone());
  rig.rotation.y += THREE.MathUtils.degToRad(deg);
  rig.updateMatrixWorld(true);
  const hp2 = rig.localToWorld(camera.position.clone());
  rig.position.add(hp.sub(hp2)); rig.updateMatrixWorld(true);
}

const handL = [V3(-0.3, 0.9, -0.2), V3(0.3, 0.9, -0.2)];
const curl = [0, 0];
function stepXR(dt) {
  rig.updateMatrixWorld(true);
  try { renderer.xr.updateCamera(camera); }              // fresh head pose for this frame
  catch (e) { reportOnce('updateCamera: ' + e.message); }
  const headL = camera.position;
  const shoulder = _tmp.a.copy(headL).add(_tmp.b.set(0, -0.22, 0));

  for (let i = 0; i < 2; i++) {
    const idx = ctrls.findIndex(c => c.userData.hand === (i === 0 ? 'left' : 'right'));
    if (idx >= 0) {
      const g = grips[idx];
      const src = g.visible ? g.position : (ctrls[idx].visible ? ctrls[idx].position : null);
      if (src) handL[i].copy(shoulder).addScaledVector(_tmp.c.copy(src).sub(shoulder), ARM_SCALE);
      const gp = ctrls[idx].userData.input && ctrls[idx].userData.input.gamepad;
      if (gp && gp.buttons) {
        const trig = gp.buttons[0] ? gp.buttons[0].value : 0, grip = gp.buttons[1] ? gp.buttons[1].value : 0;
        curl[i] = Math.max(grip, trig * 0.6);
      }
      if (i === 1 && gp && gp.axes) {                    // right stick = snap turn
        const x = gp.axes.length >= 4 ? gp.axes[2] : gp.axes[0];
        if (Math.abs(x) > 0.75) { if (!loco.turnLatch) { snapTurn(x > 0 ? -SNAP_DEG : SNAP_DEG); loco.turnLatch = true; } }
        else if (Math.abs(x) < 0.4) loco.turnLatch = false;
      }
    }
  }

  stepLocomotion(dt, headL, handL);

  // pose for the avatar (hands are clamped onto surfaces so they never sink in)
  rig.updateMatrixWorld(true);
  rig.localToWorld(pose.head.copy(headL));
  pose.q.copy(rig.quaternion).multiply(camera.quaternion);
  [pose.l, pose.r].forEach((out, i) => {
    out.copy(handL[i]); rig.localToWorld(out); pushOut(out, HAND_R, _n);
  });
  pose.cl = curl[0]; pose.cr = curl[1];
  avatar.update(dt, pose.head, pose.q, pose.l, pose.r, pose.cl, pose.cr);
}

renderer.xr.addEventListener('sessionstart', () => {
  scene.remove(camera); rig.add(camera);
  camera.position.set(0, 0, 0); camera.quaternion.identity();
  avatar.setHeadVisible(false);
  document.getElementById('hud').style.display = 'none';
  respawn();
  firstXRFrame = true;
  report('VR session started');
});
renderer.xr.addEventListener('sessionend', () => {
  rig.remove(camera); scene.add(camera);
  avatar.setHeadVisible(true); avatar.first = true;
  document.getElementById('hud').style.display = '';
  report('VR session ended');
});
let firstXRFrame = false;

// small text panel floating in front of your face so errors are readable inside the headset
const panelCanvas = document.createElement('canvas'); panelCanvas.width = 640; panelCanvas.height = 320;
const panelTex = new THREE.CanvasTexture(panelCanvas); panelTex.colorSpace = THREE.SRGBColorSpace;
const panel = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.4),
  new THREE.MeshBasicMaterial({ map: panelTex, transparent: true, depthTest: false, fog: false }));
panel.position.set(0, -0.12, -1.1); panel.renderOrder = 999; panel.visible = false;
camera.add(panel);
let panelUntil = 0;
vrPanelUpdate = (isErr) => {
  const g = panelCanvas.getContext('2d');
  g.clearRect(0, 0, 640, 320); g.fillStyle = 'rgba(0,0,0,0.72)'; g.fillRect(0, 0, 640, 320);
  g.font = '22px monospace'; g.textBaseline = 'top';
  let y = 10;
  for (const line of logLines) {
    g.fillStyle = line.startsWith('!') ? '#ff9a8a' : '#c8ff8a';
    for (let i = 0; i < line.length; i += 46) { g.fillText(line.slice(i, i + 46), 12, y); y += 26; }
  }
  panelTex.needsUpdate = true;
  panelUntil = performance.now() / 1000 + (isErr ? 90 : 8);
};

/* =====================================================================
   Desktop preview (third-person), so the page works without a headset
   ===================================================================== */
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
const pv = { pos: SPAWN.clone(), vel: V3(), yaw: 0, camYaw: 0, camPitch: 0.25, dist: 3.4, phase: 0, heading: 0, ground: false };
let dragging = false;
renderer.domElement.addEventListener('pointerdown', () => { dragging = true; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  pv.camYaw -= e.movementX * 0.006; pv.camPitch = clamp(pv.camPitch + e.movementY * 0.005, -0.3, 1.2);
});
renderer.domElement.addEventListener('wheel', e => { pv.dist = clamp(pv.dist + e.deltaY * 0.003, 1.5, 9); e.preventDefault(); }, { passive: false });

function stepPreview(dt) {
  const mx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), mz = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
  const sy = Math.sin(pv.camYaw), cy = Math.cos(pv.camYaw);
  // camera looks along (-sin, -cos) so forward = (-sin, -cos) and right = (cos, -sin)
  const wish = _tmp.a.set(mx * cy + mz * -sy, 0, mx * -sy + mz * -cy);
  if (wish.lengthSq() > 0) wish.normalize();
  const speed = keys.ShiftLeft ? 6.5 : 4;
  pv.vel.x += (wish.x * speed - pv.vel.x) * Math.min(1, dt * 10);
  pv.vel.z += (wish.z * speed - pv.vel.z) * Math.min(1, dt * 10);
  pv.vel.y -= GRAVITY * dt;
  if (keys.Space && pv.ground) pv.vel.y = 5;
  pv.pos.addScaledVector(pv.vel, dt);
  pv.ground = false;
  _c.set(pv.pos.x, pv.pos.y + 0.3, pv.pos.z); _b.copy(_c);
  if (pushOut(_c, 0.3, _n)) {
    pv.pos.add(_a.copy(_c).sub(_b));
    const vn = pv.vel.dot(_n); if (vn < 0) pv.vel.addScaledVector(_n, -vn);
    if (_n.y > 0.6) pv.ground = true;
  }
  if (pv.pos.y < -30) { pv.pos.copy(SPAWN); pv.vel.set(0, 0, 0); }

  const hs = Math.hypot(pv.vel.x, pv.vel.z), sp = Math.min(1, hs / 4);
  if (hs > 0.3) { const target = Math.atan2(-pv.vel.x, -pv.vel.z); let d = target - pv.heading; d = Math.atan2(Math.sin(d), Math.cos(d)); pv.heading += d * Math.min(1, dt * 8); }
  pv.phase += dt * (2 + sp * 7);

  // synthetic pose: head + swinging hands
  pose.head.set(pv.pos.x, pv.pos.y + 1.25, pv.pos.z);
  pose.q.setFromEuler(new THREE.Euler(0, pv.heading, 0));
  const fwd = _tmp.fwd.set(-Math.sin(pv.heading), 0, -Math.cos(pv.heading));
  const right = _tmp.right.set(Math.cos(pv.heading), 0, -Math.sin(pv.heading));
  [pose.l, pose.r].forEach((h, i) => {
    const side = i === 0 ? -1 : 1, ph = pv.phase + (i === 0 ? 0 : Math.PI);
    h.set(pose.head.x, pose.head.y - 0.22 - 0.62, pose.head.z)
      .addScaledVector(right, side * 0.42)
      .addScaledVector(fwd, Math.sin(ph) * 0.38 * sp + 0.05 + Math.sin(pv.phase * 0.5 + i) * 0.015 * (1 - sp));
    h.y += Math.max(0, Math.cos(ph)) * 0.2 * sp;
    const floorY = 0; if (h.y < floorY + HAND_R) h.y = floorY + HAND_R;
  });
  pose.cl = pose.cr = 0.15;
  avatar.update(dt, pose.head, pose.q, pose.l, pose.r, pose.cl, pose.cr);

  // third-person camera
  const tgt = _tmp.b.set(pose.head.x, pose.head.y - 0.35, pose.head.z);
  const cp = Math.cos(pv.camPitch);
  camera.position.set(tgt.x + Math.sin(pv.camYaw) * cp * pv.dist, tgt.y + Math.sin(pv.camPitch) * pv.dist, tgt.z + Math.cos(pv.camYaw) * cp * pv.dist);
  camera.lookAt(tgt);
}

/* =====================================================================
   Main loop
   ===================================================================== */
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

respawn();
pv.camYaw = 0;             // start behind the monkey, looking toward the mirror
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  const inXR = renderer.xr.isPresenting;
  try { if (inXR) stepXR(dt); else stepPreview(dt); }
  catch (e) { reportOnce('Update error: ' + e.message + ' ' + String(e.stack || '').split('\n')[1]); }
  try { updateMirror(dt); }
  catch (e) { reportOnce('Mirror error: ' + e.message); }
  if (inXR && firstXRFrame) { firstXRFrame = false; report('First VR frame drawn'); }
  panel.visible = inXR && performance.now() / 1000 < panelUntil;
  renderer.render(scene, camera);
});

// small hook for debugging / automated tests
window.__sludge = { THREE, scene, camera, rig, renderer, avatar, mirrorAvatar, pose, pv, stepLocomotion, loco, hands, pushOut, respawn, keys };

} catch (err) {
  console.error(err);
  const el = document.getElementById('err');
  el.style.display = 'flex';
  el.textContent = 'Sludge Slop failed to start: ' + err.message;
}
</script>
</body>
</html>
